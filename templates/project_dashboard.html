{% extends "base.html" %}

{% block content %}

{% include "includes/navbar.html" %}

<div class="container mt-4">

    <h2>{{ project.project_name }}</h2>

    <p class="text-muted">
        {{ project.description }}
    </p>

    <hr>

    <div class="row">

        <div class="col-md-3 mb-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6>Total Records</h6>

                    <h2>0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6>English</h6>

                    <h2>0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6>Malayalam</h6>

                    <h2>0</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h6>Corrections</h6>

                    <h2>0</h2>

                </div>

            </div>

        </div>

    </div>

    <hr>

    <div class="row">

        <div class="col-md-3 mb-3">

            <a
            href="{{ url_for('project.import_dataset', project_id=project.id) }}"
            class="btn btn-primary w-100">

            📥 Import Dataset

            </a>

        </div>

        <div class="col-md-3 mb-3">

            <button class="btn btn-success w-100">

                ▶ Start Editing

            </button>

        </div>

        <div class="col-md-3 mb-3">

            <button class="btn btn-warning w-100">

                📤 Export

            </button>

        </div>

        <div class="col-md-3 mb-3">

            <button class="btn btn-secondary w-100">

                ⚙ Settings

            </button>

        </div>

    </div>

</div>

{% endblock %}
