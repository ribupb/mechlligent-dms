{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<h2>

Import Dataset

</h2>

<hr>

<form
method="POST"
enctype="multipart/form-data">

<div class="mb-3">

<label>

Select Excel Dataset

</label>

<input
type="file"
name="dataset"
class="form-control"
accept=".xlsx"
required>

</div>

<button
class="btn btn-primary">

Upload Dataset

</button>

</form>

</div>

{% endblock %}
