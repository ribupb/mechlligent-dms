<div class="editor-toolbar {{ toolbar_side|default('left') }}">

    <button type="button"
            class="editor-tool"
            data-command="bold"
            title="Bold">
        <strong>B</strong>
    </button>

    <button type="button"
            class="editor-tool"
            data-command="italic"
            title="Italic">
        <em>I</em>
    </button>

    <button type="button"
            class="editor-tool"
            data-command="underline"
            title="Underline">
        <u>U</u>
    </button>

    <button type="button"
            class="editor-tool"
            data-command="strikeThrough"
            title="Strikethrough">
        <s>S</s>
    </button>

    <div class="toolbar-divider"></div>

    <button type="button"
            class="editor-tool"
            data-command="hiliteColor"
            data-value="#fff3a3"
            title="Highlight">
        🖍
    </button>

    <button type="button"
            class="editor-tool"
            data-command="insertUnorderedList"
            title="Bullet List">
        •
    </button>

    <button type="button"
            class="editor-tool"
            data-command="insertOrderedList"
            title="Numbered List">
        1.
    </button>

    <div class="toolbar-divider"></div>

    <button type="button"
            class="editor-tool"
            data-command="undo"
            title="Undo">
        ↶
    </button>

    <button type="button"
            class="editor-tool"
            data-command="redo"
            title="Redo">
        ↷
    </button>

    <button type="button"
            class="editor-tool"
            data-command="removeFormat"
            title="Clear Formatting">
        Tx
    </button>

</div>
