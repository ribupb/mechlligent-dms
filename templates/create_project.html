{% extends "base.html" %}

{% block content %}

{% include "includes/navbar.html" %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h3>Create New Project</h3>

            <hr>

            <form>

                <div class="mb-3">

                    <label class="form-label">

                        Project Name

                    </label>

                    <input
                        type="text"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Description

                    </label>

                    <textarea
                        class="form-control"
                        rows="3"></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Upload English Backbone

                    </label>

                    <input
                        type="file"
                        class="form-control">

                </div>

                <button
                    class="btn btn-primary">

                    Create Project

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
