<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">




    <title>MECHLLIGENT DMS</title>


    <link rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='favicons/favicon.ico') }}">

    <link rel="icon"
        type="image/png"
        sizes="32x32"
        href="{{ url_for('static', filename='favicons/favicon-32x32.png') }}">

    <link rel="icon"
        type="image/png"
        sizes="16x16"
        href="{{ url_for('static', filename='favicons/favicon-16x16.png') }}">

    <link rel="apple-touch-icon"
        href="{{ url_for('static', filename='favicons/apple-touch-icon.png') }}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/editor.css') }}">

    <!-- Page-specific CSS -->
    {% block head %}{% endblock %}
</head>

<body>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}
    {% endblock %}

    <script src="{{ url_for('static', filename='js/editor.js') }}"></script>

</body>
</html>
